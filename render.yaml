# Render "Blueprint" -- lets Render provision the web service AND its
# database together from one file, instead of clicking through separate
# "New Web Service" / "New Database" screens and manually copying the
# connection string between them. From the Render dashboard: New -> Blueprint
# -> pick this repo -> Render reads this file and shows both resources ready
# to create in one click.
#
# fromDatabase below is what actually wires the two together: Render
# creates symbiolink-db first, then injects its real connection string into
# the web service's DATABASE_URL environment variable automatically -- you
# never see or copy a password by hand.
databases:
  - name: symbiolink-db
    databaseName: symbiolink
    plan: free

services:
  - type: web
    name: symbiolink-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # workers=1 is deliberate, not a typo: orders.py, trust.py's ledger, and
    # the WhatsApp inbox all keep their live/in-progress state in a plain
    # Python list in this process's memory rather than the database (only
    # seeded historical data and signups/listings go through the DB). With
    # more than one gunicorn worker, each is a separate OS process with its
    # own copy of that memory -- an order placed on worker A is invisible to
    # worker B, so a follow-up request (e.g. paying for that order) landing
    # on B fails with "Order not found" even though the order really was
    # created. One worker keeps every request on the same in-memory state;
    # --threads 8 keeps plenty of concurrency for a demo's traffic level.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Token for the one-time /admin/seed-database?token=... URL. Random per
      # deploy; copy it from the service's Environment tab.
      - key: SEED_TOKEN
        generateValue: true
      # Unbuffered stdout/stderr so errors (e.g. SMTP failures) reach the logs.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: symbiolink-db
          property: connectionString
      # Optional integrations -- every one of these already has a working
      # "simulation mode" fallback when unset (see whatsapp_service.py,
      # payment_service.py, email_service.py, maps_service.py), so the app
      # runs and demos fine with none of them filled in. Add real values
      # later in the Render dashboard (Environment tab) any time, without a
      # redeploy of the code itself.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: SymbioLink AI
      # Render's free tier blocks outbound SMTP -- set this to send email
      # through Brevo's HTTPS API instead (free, 300/day). SMTP_FROM_ADDRESS
      # must be a sender verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
